name: Test VPS SSH

on:
  push:
    branches: [deploy/ims]

permissions: {}

jobs:
  test-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify GitHub Actions can log in to the VPS
        shell: bash
        env:
          VPS_HOST: ${{ vars.IMS_VPS_HOST }}
          VPS_USER: ${{ vars.IMS_VPS_USER }}
          VPS_HOST_KEY: ${{ vars.IMS_VPS_HOST_KEY }}
          VPS_PRIVATE_KEY: ${{ secrets.IMS_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set repository variable IMS_VPS_HOST}"
          : "${VPS_USER:?Set repository variable IMS_VPS_USER}"
          : "${VPS_HOST_KEY:?Set repository variable IMS_VPS_HOST_KEY}"
          : "${VPS_PRIVATE_KEY:?Set repository secret IMS_VPS_SSH_PRIVATE_KEY}"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/ims-ssh"
          trap 'rm -f "$RUNNER_TEMP/ims-ssh/key"' EXIT
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$RUNNER_TEMP/ims-ssh/key"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ims-ssh/known_hosts"
          ssh -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ims-ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i "$RUNNER_TEMP/ims-ssh/key" \
            "$VPS_USER@$VPS_HOST" 'id -un && hostname'
